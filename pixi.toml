# Pixi environment of the batch jobs (scripts/ttJ/run_job.sh installs it from pixi.lock in each job; pixi from
# /cvmfs/cms-griddata.cern.ch/cat/sw/pixi). The versions are those of the conda environment that produced the ttJ
# results so far (coffea 0.7.22, correctionlib 2.6.1), each from the same source (conda-forge or PyPI wheel); setup.cfg
# and test_env.yml name newer coffea / correctionlib.
# The package itself is not installed: the jobs put <checkout>/src on PYTHONPATH (src/BTVNanoCommissioning/version.py
# is written by setuptools_scm, e.g. by `pip install -e .` once in the checkout).
[workspace]
name = "BTVNanoCommissioning"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.10.*"
xrootd = "5.5.1.*"  # python bindings for uproot's XRootD source
ca-policy-lcg = "*"

[pypi-dependencies]
coffea = "==0.7.22"
awkward = "==1.10.5"
uproot = "==4.3.7"
uproot3 = "==3.14.4"
numpy = "==1.23.5"
numba = "==0.60.0"
llvmlite = "==0.43.0"
scipy = "==1.14.0"
correctionlib = "==2.6.1"
hist = "==2.7.3"
boost-histogram = "==1.4.1"
vector = "==1.4.1"
uhi = "==0.4.0"  # histogram protocols of hist / boost-histogram
pyarrow = "==10.0.1"
pandas = "==2.2.2"
onnxruntime = "==1.20.1"
matplotlib = "==3.9.1"
mplhep = "==0.3.50"
psutil = "==6.0.0"
cloudpickle = "==3.0.0"
lz4 = "==4.3.3"
zstandard = "==0.23.0"
fsspec = "==2024.6.1"
pyyaml = "==6.0.1"
cachetools = "==5.4.0"
tqdm = "==4.66.4"
p-tqdm = "==1.4.2"
alive-progress = "*"
setuptools = "==70.1.1"

# The analysis on top of the grid environment: `pixi run -e analysis ...` (scripts/ttJ/analysis: fits, sPlot, the
# simulation and generator comparisons, the cms-plotting / plotlyhep figures, the HTML deck). It is the grid
# environment plus these packages, so the coffea steps (build_ttJ.py, dump_cands.py) run in it as well and the grid
# environment itself (and its lock) is unchanged. kaleido renders PNG/PDF with a Chrome found on the machine
# (`pixi run -e analysis python -c "import kaleido; kaleido.get_chrome_sync()"` downloads one where there is none).
[feature.analysis.pypi-dependencies]
iminuit = "==2.32.0"
plotly = "==6.7.0"
kaleido = "==1.5.0"
pillow = "==11.2.1"
plotlyhep = { git = "https://github.com/DickyChant/plotlyhep", rev = "49fe516c52590b45d041f0bd2d57e2ec15d5b27f" }

# The Manim explainer animation (scripts/ttJ/analysis/anim): its own stack (cairo, pango, ffmpeg from conda-forge),
# not on top of the grid environment.
[feature.anim.dependencies]
python = "3.12.*"
manim = "0.19.0.*"

[environments]
analysis = ["analysis"]
anim = { features = ["anim"], no-default-feature = true }
